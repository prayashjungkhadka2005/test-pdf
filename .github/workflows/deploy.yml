name: Sync FluxStack Status

on:
  push:
    branches: ['main']
    paths: ['migrations/**']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. YOUR DEPLOYMENT STEP ---
      # Add your own psql / prisma / migration command here
      # - name: Run SQL Migrations
      #   run: psql ${{ secrets.DATABASE_URL }} -f migrations/latest.sql

      # --- 2. NOTIFY FLUXSTACK ---
      - name: Update FluxStack Dashboard
        if: success()
        run: |
          # 1. Get newest migration file
          LATEST_FILE=$(ls -t migrations/*.sql | head -n 1)
          FILENAME=$(basename "$LATEST_FILE" .sql)
          
          # 2. Extract tag (removes timestamp prefix like 20260117183000_)
          MIGRATION_TAG=$(echo "$FILENAME" | sed -E 's/^[0-9]{14}_//')
          
          echo "✅ Successful migration: $MIGRATION_TAG"

          if [ "${{ github.ref_name }}" == "main" ]; then
            ENV_ID="${{ secrets.FLUXSTACK_ENV_STAGING_ID }}"
          else
            echo "Branch not mapped. Skipping sync."
            exit 0
          fi

          # 3. Inform FluxStack to clear the "Pending" status
          curl -s -X POST "https://fluxstack.io/api/external/sync-deployment" \
            -H "Authorization: Bearer ${{ secrets.FLUXSTACK_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"projectId\": \"cmj38dk9j0001jw04kqbsee8e\", \"environmentId\": \"\$ENV_ID\", \"tag\": \"\$MIGRATION_TAG\"}"
