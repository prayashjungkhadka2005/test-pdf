name: Deploy & Sync FluxStack

on:
  push:
    branches: ['main']
    paths: ['migrations/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update FluxStack
        if: success()
        env:
          PROJECT_ID: "cmj38dk9j0001jw04kqbsee8e"
          API_KEY: "${{ secrets.FLUXSTACK_API_KEY }}"
        run: |
          # 1. Get the latest migration file
          LATEST_FILE=$(ls -t migrations/*.sql | head -n 1)
          FILENAME=$(basename "$LATEST_FILE" .sql)
          
          # 2. Extract tag (handles YYYYMMDDTHHMMSS_tag.sql)
          MIGRATION_TAG=$(echo "$FILENAME" | sed -E 's/^[0-9]+T[0-9]+_//')
          echo "🚀 Deploying migration: $MIGRATION_TAG"

          if [ "${{ github.ref_name }}" == "main" ]; then
            ENV_ID="${{ secrets.FLUXSTACK_ENV_STAGING_ID }}"
          else
            echo "Branch not mapped. Skipping sync."
            exit 0
          fi

          # 3. Tell FluxStack to EXECUTE and SYNC
          curl -s -X POST "https://fluxstack.io/api/external/sync-deployment" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"projectId\": \"$PROJECT_ID\", \"environmentId\": \"\$ENV_ID\", \"tag\": \"\$MIGRATION_TAG\", \"executeSql\": true}"
